<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Test affiliate native anchor V8</title>
<style>
body{font-family:Arial,sans-serif;max-width:760px;margin:50px auto;padding:20px;line-height:1.6}
input{width:100%;padding:10px;box-sizing:border-box;margin:8px 0 14px}
a{display:inline-block;padding:11px 18px;border-radius:8px;background:#d987bf;color:#fff;font-weight:700;text-decoration:none}
#status{margin-top:18px;padding:12px;background:#fff4fa;border-radius:8px}
</style>
</head>
<body>
<h2>Test đúng cơ chế trang truyện V8</h2>
<p>Dán link Shopee/TikTok. Link ngoài dùng anchor thật target="_blank".</p>
<input id="url" placeholder="https://...">
<a id="go" href="#" target="_blank" rel="noopener sponsored">Mở link ở tab mới</a>
<div id="status">Trang test hiện tại chưa chuyển.</div>

<script>
let pending=false;
let timer=null;

function moveCurrent(){
  if(!pending)return;
  pending=false;
  if(timer)clearTimeout(timer);
  document.getElementById("status").textContent=
    "OK: tab hiện tại đã chạy bước chuyển chương.";
}

document.addEventListener("visibilitychange",()=>{
  if(document.hidden&&pending)moveCurrent();
});
window.addEventListener("blur",()=>{
  if(pending)moveCurrent();
});
window.addEventListener("focus",()=>{
  if(pending)moveCurrent();
});

document.getElementById("go").onclick=function(){
  const raw=document.getElementById("url").value.trim();
  let target="";
  try{
    const u=new URL(raw);
    if(!["http:","https:"].includes(u.protocol))throw new Error();
    target=u.href;
  }catch(_){
    alert("Link không hợp lệ");
    return false;
  }

  this.href=target;
  pending=true;
  timer=setTimeout(moveCurrent,900);

  // KHÔNG preventDefault: để Chrome tự xử lý target=_blank.
  return true;
};
</script>
</body>
</html>
