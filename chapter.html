<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đọc chương - Ting Ting Tang Tang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Noto+Serif:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css?v=20260829-style1">

  <style>
    body {
      margin: 0;
      background: #f9f2f8 !important;
      color: #4f4150 !important;
      font-family: "Nunito", Arial, sans-serif;
      font-weight: 600;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .header {
      display: grid;
      grid-template-columns: 360px 1fr;
      align-items: center;
      gap: 20px;
      padding: 16px 5%;
      background: #fff7fc !important;
      border-bottom: 1px solid #ead5e4 !important;
      box-shadow: 0 6px 22px rgba(185,111,163,.08);
    }

    .logo {
      font-family: "Great Vibes", cursive;
      font-size: 34px;
      color: #c77fb1 !important;
      white-space: nowrap;
      line-height: 1;
    }

    .menu {
      display: flex;
      justify-content: flex-end;
      gap: 28px;
      font-size: 18px;
      font-weight: 800;
      color: #6b5268;
    }

    .menu a {
      color: #6b5268 !important;
    }

    .reader {
      max-width: 960px;
      margin: 34px auto;
      padding: 0 18px;
      background: transparent !important;
    }

    .chapter-nav {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 22px 0;
    }

    .chapter-nav a {
      background: #d88ac0 !important;
      color: #fff !important;
      padding: 11px 20px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 8px 22px rgba(216,138,192,.22);
    }

    .chapter-nav a.disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    .chapter-box {
      background: #ffffff !important;
      border: 1px solid #ead5e4 !important;
      border-radius: 18px;
      padding: 38px 46px;
      box-shadow: 0 10px 28px rgba(185,111,163,.12);
    }

    h1 {
      font-family: "Playfair Display", serif;
      text-align: center;
      color: #b96fa3 !important;
      font-size: 30px;
      line-height: 1.32;
      margin: 0 0 16px;
      font-weight: 800;
    }

    /* Số chương nhỏ hơn tên chương để các số 3 chữ số như 480 không bị nặng */
    #chapterTitle .chapter-number-label {
      display: inline-block;
      font-family: "Nunito", Arial, sans-serif;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 900;
      margin-right: 9px;
      vertical-align: 3px;
      color: #b96fa3 !important;
      white-space: nowrap;
    }

    #chapterTitle .chapter-name-label {
      font-family: "Playfair Display", serif;
      font-size: 30px;
      line-height: 1.32;
      font-weight: 800;
      color: #b96fa3 !important;
    }

    .story-title {
      text-align: center;
      color: #8e6b91 !important;
      margin-bottom: 36px;
      font-weight: 800;
      font-size: 17px;
    }

    .chapter-content {
      font-family: "Noto Serif", Georgia, serif;
      font-size: 22px;
      line-height: 2.1;
      color: #2f2433 !important;
      font-weight: 600;
      text-align: justify;
      text-align-last: left;
      word-break: normal !important;
      overflow-wrap: break-word !important;
      white-space: normal !important;
    }

    .chapter-content p {
      margin: 0 0 24px;
      color: #2f2433 !important;
      font-weight: 600;
      text-align: justify;
      text-align-last: left;
    }

    .comment-section {
      margin-top: 34px;
      background: #ffffff;
      border: 1px solid #ead5e4;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 28px rgba(185,111,163,.12);
    }

    .comment-section h2 {
      margin-top: 0;
      color: #b96fa3;
      font-family: "Playfair Display", serif;
      font-size: 30px;
      font-weight: 900;
    }

    .comment-form {
      display: grid;
      gap: 12px;
      margin-bottom: 22px;
    }

    .comment-form input,
    .comment-form textarea {
      width: 100%;
      background: #fffafd;
      border: 1px solid #ead5e4;
      color: #2f2433;
      font-weight: 700;
      border-radius: 12px;
      padding: 12px 14px;
      font-family: "Nunito", Arial, sans-serif;
    }

    .comment-form textarea {
      min-height: 110px;
      resize: vertical;
    }

    .comment-form button,
    .comment-delete {
      width: fit-content;
      background: #d88ac0;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 800;
      cursor: pointer;
      font-family: "Nunito", Arial, sans-serif;
    }

    .comment-delete {
      background: #e7798f;
      margin-top: 8px;
    }

    .comment-item {
      border-top: 1px solid #ead5e4;
      padding: 16px 0;
    }

    .comment-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #5b4258;
    }

    .comment-head b {
      font-weight: 900;
    }

    .comment-head span {
      color: #9a8193;
      font-size: 13px;
    }

    .comment-item p {
      color: #2f2433;
      font-weight: 700;
      line-height: 1.7;
      margin: 10px 0 0;
    }

    @media (max-width: 760px) {
      .header {
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 10px 14px;
      }

      .logo {
        font-size: 29px;
        text-align: center;
      }

      .menu {
        justify-content: center;
        gap: 22px;
        font-size: 14px;
      }

      .reader {
        margin: 18px auto;
        padding: 0 12px;
      }

      .chapter-box {
        padding: 24px 18px;
        border-radius: 14px;
      }

      h1 {
        font-size: 24px;
        line-height: 1.32;
      }

      #chapterTitle .chapter-number-label {
        font-size: 18px;
        margin-right: 6px;
        vertical-align: 2px;
      }

      #chapterTitle .chapter-name-label {
        font-size: 24px;
      }

      .story-title {
        font-size: 15px;
        margin-bottom: 28px;
      }

      .chapter-content {
        font-size: 18px;
        line-height: 1.9;
      }

      .chapter-content p {
        margin-bottom: 18px;
      }

      .chapter-nav a {
        font-size: 13px;
        padding: 9px 13px;
      }

      .comment-section {
        padding: 18px;
        border-radius: 14px;
      }

      .comment-section h2 {
        font-size: 25px;
      }
    }

    /* =========================================================
       BẢO VỆ NỘI DUNG CHƯƠNG
       - Chặn bôi đen/copy thông thường
       - Chặn menu chuột phải/long-press
       - Watermark lặp trên phần nội dung
       - Không ảnh hưởng form thanh toán / bình luận
    ========================================================= */
    .chapter-content.protected-reader {
      position: relative;
      isolation: isolate;
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
      cursor: default;
    }

    .chapter-content.protected-reader p {
      position: relative;
      z-index: 1;
      -webkit-user-select: none !important;
      user-select: none !important;
    }

    .chapter-content.protected-reader::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: var(--reader-watermark, none);
      background-repeat: repeat;
      background-size: 430px 220px;
      opacity: .78;
    }

    .copy-protect-toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(12px);
      z-index: 99999;
      max-width: min(90vw, 520px);
      padding: 11px 18px;
      border-radius: 999px;
      background: rgba(47, 36, 51, .94);
      color: #fff;
      font-family: "Nunito", Arial, sans-serif;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .copy-protect-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media print {
      body * {
        visibility: hidden !important;
      }

      body::before {
        content: "Nội dung đọc trực tuyến tại chamdoctruyen.info. Chức năng in đã được tắt.";
        visibility: visible !important;
        position: fixed;
        inset: 40px;
        font: 700 20px/1.6 Arial, sans-serif;
        color: #333;
      }
    }

  </style>

  <script>
    // Dọn service worker quảng cáo cũ một lần trên trình duyệt đã từng truy cập website.
    if ("serviceWorker" in navigator && !localStorage.getItem("tttt_ads_sw_cleaned_v1")) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
      }).finally(function () {
        localStorage.setItem("tttt_ads_sw_cleaned_v1", "1");
      });
    }
  </script>

</head>

<body>

<header class="header">
  <a href="./index.html" class="logo">Ting Ting Tang Tang</a>
  <nav class="menu">
    <a href="./index.html">Trang chủ</a>
    <a id="backStory" href="#">Chi tiết truyện</a>
  </nav>
</header>

<main class="reader">
  <div class="chapter-nav">
    <a id="prevTop" href="#">← Chương trước</a>
    <a id="nextTop" href="#">Chương sau →</a>
  </div>

  <section class="chapter-box">
    <h1 id="chapterTitle">Đang tải chương...</h1>
    <div class="story-title" id="storyName"></div>
    <article class="chapter-content" id="chapterContent"></article>
  </section>

  <div id="commentBox"></div>

  <div class="chapter-nav">
    <a id="prevBottom" href="#">← Chương trước</a>
    <a id="nextBottom" href="#">Chương sau →</a>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/text-normalizer.js"></script>
<script src="js/paywall.js?v=20260829-unlock2"></script>
<script src="js/chapter.js?v=20260901-copy-protect-1"></script>
<script src="js/comments.js"></script>
</body>
</html>
