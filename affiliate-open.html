<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Đang mở liên kết…</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;
      background:#fff8fc;color:#5f4b5a;
      font-family:Arial,sans-serif;padding:24px;text-align:center
    }
    .box{
      width:min(92vw,520px);padding:28px 22px;border:1px solid #ebc9df;
      border-radius:18px;background:#fff;box-shadow:0 12px 34px rgba(185,111,163,.12)
    }
    .icon{font-size:40px;margin-bottom:10px}
    h1{font-size:20px;margin:0 0 8px;color:#9d4d87}
    p{font-size:14px;line-height:1.6;margin:0 0 16px}
    a{
      display:inline-block;padding:10px 18px;border-radius:999px;
      background:#d987bf;color:#fff;text-decoration:none;font-weight:700
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🛍️</div>
    <h1>Đang mở Shopee / TikTok…</h1>
    <p>Nếu ứng dụng không tự mở, hãy nhấn nút bên dưới.</p>
    <a id="openLink" href="#">Mở liên kết</a>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const raw = params.get("url") || "";
      let target = "";

      try {
        const u = new URL(raw);
        if (u.protocol === "https:" || u.protocol === "http:") {
          target = u.href;
        }
      } catch (_) {}

      const a = document.getElementById("openLink");

      if (!target) {
        document.querySelector("h1").textContent = "Liên kết không hợp lệ";
        document.querySelector("p").textContent = "Vui lòng quay lại trang truyện.";
        a.style.display = "none";
        return;
      }

      a.href = target;
      a.rel = "noopener noreferrer sponsored";

      // Để tab mới được tạo xong trước rồi mới chuyển ra ngoài.
      setTimeout(function () {
        location.replace(target);
      }, 250);
    })();
  </script>
</body>
</html>
