<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Test affiliate Chrome v7</title>
<style>
body{font-family:Arial,sans-serif;max-width:760px;margin:50px auto;padding:20px;line-height:1.6}
input{width:100%;padding:10px;box-sizing:border-box;margin:8px 0 14px}
button{padding:11px 18px;border:0;border-radius:8px;background:#d987bf;color:white;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<h2>Test đúng logic đang dùng trong trang truyện</h2>
<p>Dán link Shopee/TikTok. Sau khi bấm: link ngoài mở tab mới, trang test này sẽ đổi chữ sau 600ms.</p>
<input id="url" placeholder="https://...">
<button id="btn">Test mở tab mới</button>
<p id="status">Trang hiện tại chưa chuyển.</p>
<script>
document.getElementById("btn").onclick=function(event){
  event.preventDefault();

  const raw=document.getElementById("url").value.trim();
  let target="";
  try{
    const u=new URL(raw);
    if(!["http:","https:"].includes(u.protocol)) throw new Error();
    target=u.href;
  }catch(_){
    return alert("Link không hợp lệ");
  }

  const newTab=window.open(target,"_blank");
  if(!newTab){
    alert("Chrome đang chặn tab mới.");
    return false;
  }

  setTimeout(function(){
    document.getElementById("status").textContent =
      "OK: tab hiện tại đã chạy bước chuyển chương sau 600ms.";
  },600);

  return false;
};
</script>
</body>
</html>
